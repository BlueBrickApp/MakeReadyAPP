    <script>
      // Fallback for static hosts (e.g. GitHub Pages serving from repository root without Vite dev server)
      if (window.location.hostname.endsWith('github.io') && !document.querySelector('script[src*="assets/app.js"]')) {
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './assets/index.css';
        document.head.appendChild(css);

        var script = document.createElement('script');
        script.type = 'module';
        script.crossOrigin = 'anonymous';
        script.src = './assets/app.js';
        document.head.appendChild(script);
      }
    </script>
  </head>
  <body class="bg-[#080C14] text-slate-100 antialiased selection:bg-[#00FFB4] selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
